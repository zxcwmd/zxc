name: Bloom Client Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0f20e-zxc

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        shell: pwsh
        run: |
          npm run dist:win 2>&1 | Tee-Object -FilePath build-windows.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content build-windows.log -Tail 25) -join ' | '
            $tail = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A').Replace(':', '%3A').Replace(',', '%2C')
            Write-Output "::error title=Windows build output::$tail"
            exit $LASTEXITCODE
          }

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: bloom-client-windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bloom-client-windows-build-log
          path: build-windows.log
          if-no-files-found: ignore
          retention-days: 14
