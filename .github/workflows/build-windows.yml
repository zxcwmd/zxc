name: Bloom Client Windows build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the installer as a public GitHub pre-release
        type: boolean
        required: true
        default: false
      release_tag:
        description: Release tag to create when publishing
        type: string
        required: true
        default: v0.5.3-preview.1
  push:
    branches:
      - arena/01a0f20e-zxc

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        shell: pwsh
        run: |
          npm run dist:win 2>&1 | Tee-Object -FilePath build-windows.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content build-windows.log -Tail 25) -join ' | '
            $tail = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A').Replace(':', '%3A').Replace(',', '%2C')
            Write-Output "::error title=Windows build output::$tail"
            exit $LASTEXITCODE
          }

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: bloom-client-windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish public GitHub pre-release
        if: (github.event_name == 'workflow_dispatch' && inputs.publish_release) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-release]'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || 'v0.5.3-preview.1' }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9A-Za-z][0-9A-Za-z.-]*$') {
            throw 'Release tag must start with v and contain only letters, numbers, dots, and hyphens.'
          }
          $installer = Get-ChildItem -Path release -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not produced.' }
          gh release create $env:RELEASE_TAG $installer.FullName --target $env:GITHUB_SHA --title "Bloom Client 0.5.3 Preview 1" --notes "Cherry Grove main menu with four round navigation buttons, a seated 3D player preview, and a dedicated Play setup flow. The Builds hub includes Bloom profiles and Modrinth modpacks with verified .mrpack installation. Windows x64 installer built from commit $env:GITHUB_SHA." --prerelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bloom-client-windows-build-log
          path: build-windows.log
          if-no-files-found: ignore
          retention-days: 14
